<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nhận diện cây dược liệu</title><link rel="stylesheet" href="/assets/style.css"></head>
<body><main><header><h1>Nhận diện cây dược liệu</h1></header>
<section class="panels"><article><h2>Chọn ảnh cây</h2><label class="drop" id="drop"><input id="file" type="file" accept="image/*"><span>Chọn ảnh hoặc kéo thả ảnh vào đây</span></label><img id="preview" alt="Ảnh đã chọn" hidden><button id="submit" disabled>Nhận diện</button><p id="status" aria-live="polite"></p></article>
<article><h2>Kết quả nhận diện</h2><div id="result" class="placeholder" aria-live="polite">Chưa có kết quả.</div></article></section>
<footer>Thông tin mang tính tham khảo, không thay thế hướng dẫn chuyên môn về sử dụng dược liệu.</footer></main><script src="/assets/app.js?v=fix1"></script></body></html>
